id: sniper-local-powered-by-v1

info:
  name: Local X-Powered-By response header
  author: sniper-community
  severity: info
  description: Reports an X-Powered-By header from an explicitly selected loopback HTTP service.

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    redirects: false
    matchers:
      - type: word
        part: header
        words:
          - "X-Powered-By:"
