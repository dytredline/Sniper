name: Sniper Community CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install pinned runtime dependency
        run: python -m pip install --no-deps -r requirements-runtime.lock
      - name: Install pinned test dependencies
        run: python -m pip install --no-deps -r requirements-test.lock
      - name: Verify dependency closure
        run: python -m pip check
      - name: Validate Community release surface
        run: python .github/scripts/validate-community-release.py
      - name: Assemble and validate Community source tree
        run: |
          python scripts/build-community-source.py --output "${RUNNER_TEMP}/sniper-community-source"
          python .github/scripts/validate-community-release.py \
            --root "${RUNNER_TEMP}/sniper-community-source" --scan-release-tree
      - name: Verify documented entrypoints
        run: |
          python scripts/sniper-mcp --help
          python scripts/sniper-project-audit --help
          python cli_reports.py --help
      - name: Run Python and JavaScript tests
        run: python scripts/run_all_tests.py --verbose
      - name: Validate Compose configuration
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only-placeholder
        run: docker compose --profile monitoring config --quiet
      - name: Build local image
        run: docker build --tag sniper-community:${{ github.sha }} .
      - name: Boot local image and verify health
        run: |
          container_name="sniper-community-ci-${{ github.run_id }}"
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container_name" \
            --env SNIPER_ALLOW_UNAUTHENTICATED_REMOTE=1 \
            "sniper-community:${{ github.sha }}"
          for attempt in $(seq 1 30); do
            health_status=$(docker inspect --format '{{.State.Health.Status}}' "$container_name")
            if [ "$health_status" = "healthy" ]; then
              exit 0
            fi
            if [ "$health_status" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done
          docker logs "$container_name"
          exit 1
