name: Community release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate Community metadata
        run: python .github/scripts/validate-community-release.py
      - name: Verify source entrypoint
        run: python scripts/sniper-mcp --help
      - name: Build and validate source release
        run: |
          VERSION=$(tr -d '\n\r' < COMMUNITY_VERSION)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "tag must match COMMUNITY_VERSION (expected v${VERSION})" >&2
            exit 1
          fi
          python scripts/build-community-source.py --output "sniper-community-${VERSION}"
          python .github/scripts/validate-community-release.py \
            --root "sniper-community-${VERSION}" --scan-release-tree
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "sniper-community-${VERSION}.tar.gz" "sniper-community-${VERSION}"
          sha256sum "sniper-community-${VERSION}.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sniper-community-source
          path: |
            sniper-community-*.tar.gz
            SHA256SUMS
          if-no-files-found: error
      - name: Publish GitHub release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '\n\r' < COMMUNITY_VERSION)
          gh release create "v${VERSION}" \
            "sniper-community-${VERSION}.tar.gz" \
            "SHA256SUMS" \
            --verify-tag \
            --title "Sniper Community v${VERSION}" \
            --generate-notes
