name: Bug report
description: Report a reproducible Sniper Community defect using safe local evidence.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities in a public issue. Use the private reporting link below instead.
        Remove credentials, personal data, customer code, production databases, and generated evidence.
  - type: input
    id: version
    attributes:
      label: Sniper Community version or commit
      placeholder: v1.0.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - MCP
        - Command line
        - Local web
        - Release tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe local reproduction
      description: Provide the smallest local fixture and exact commands needed to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python and Node versions, and the optional engines involved.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data and authorization check
      options:
        - label: I removed secrets, personal data, and production evidence
          required: true
        - label: I used only local fixtures or systems I own or am explicitly authorized to assess
          required: true
