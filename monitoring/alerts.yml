groups:
  - name: sniper
    rules:
      - alert: SniperUnavailable
        expr: up{job="sniper"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Sniper has been unreachable for two minutes
      - alert: SniperHighErrorRate
        expr: sum(rate(sniper_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(sniper_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Sniper HTTP 5xx rate is above five percent
      - alert: SniperSlowResponses
        expr: histogram_quantile(0.95, sum by (le) (rate(sniper_http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Sniper p95 response time is above one second
